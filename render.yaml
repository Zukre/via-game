services:
  - type: web
    name: via-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python via_server.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
